name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install IPOPT build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y coinor-libipopt-dev libblas-dev liblapack-dev pkg-config
      - name: Install dependencies
        run: pip install -e ".[dev]" pytest-cov
      - name: Lint with ruff
        run: ruff check src tests examples
      - name: Run tests with coverage
        run: pytest tests/ -v --cov=src/ryd_gate --cov=src/qoc --cov-report=xml --cov-report=term-missing
      - name: Validate result reports
        run: python .agents/skills/results-report/validate.py --allow-missing-local-artifacts
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create scientific Python environment
        run: |
          conda create --yes --prefix "$RUNNER_TEMP/ryd-ci" \
            --override-channels --channel conda-forge \
            python=3.11 pip cyipopt=1.7.0
          echo "$RUNNER_TEMP/ryd-ci/bin" >> "$GITHUB_PATH"
      - name: Install dependencies
        run: pip install -e ".[dev]" pytest-cov
      - name: Lint with ruff
        run: ruff check src tests examples
      - name: Run tests with coverage
        run: pytest tests/ -v --cov=src/ryd_gate --cov=src/qoc --cov-report=xml --cov-report=term-missing
      - name: Validate result reports
        run: python .agents/skills/results-report/validate.py --allow-missing-local-artifacts
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

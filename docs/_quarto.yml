project:
  type: website
  output-dir: _build/html

website:
  title: "ryd-gate"
  navbar:
    left:
      - href: index.qmd
        text: Home
      - href: getting_started.qmd
        text: Getting Started
      - href: hamiltonians.qmd
        text: Hamiltonians
      - href: reference/index.qmd
        text: API Reference
  sidebar:
    style: docked
    contents:
      - index.qmd
      - section: Guides
        contents:
          - getting_started.qmd
          - fundamentals.qmd
          - hamiltonians.qmd
          - how_to_noise.qmd
          - how_to_gates.qmd
          - capability_matrix.qmd
      - section: Reference
        contents:
          - reference/index.qmd

format:
  html:
    theme: cosmo
    toc: true
    html-math-method: mathjax

quartodoc:
  package: ryd_gate
  dir: reference
  parser: numpy
  title: API Reference
  sections:
    - title: Simulation entry point
      desc: Backend dispatcher over the exact and tensor-network engines.
      contents:
        - simulate.simulate
    - title: Systems and level structures
      desc: The universal Rydberg system and the atom models it is built from.
      contents:
        - core.system.RydbergSystem
        - core.level_structures.InteractionSpec
        - core.level_structures.level_structure
    - title: Registers
      desc: Atom geometry (positions, sublattice signs) and plotting.
      contents:
        - lattice.Register
        - lattice.is_in_domain
        - lattice.plot_spatial_rydberg
    - title: Protocols
      desc: >
        Continuous-time pulse protocols — the single control surface.
        Every protocol is fully specified at construction; binding it to a
        system resolves its normalized quantities (`system.t_gate`).
      contents:
        - protocols.base.Protocol
        - protocols.lattice_dynamics.TFIMQuenchProtocol
        - protocols.lattice_dynamics.TFIMAnnealProtocol
        - protocols.lattice_dynamics.TFIMRydbergControls
        - protocols.lattice_dynamics.tfim_to_rydberg_controls
        - protocols.lattice_dynamics.interaction_longitudinal_shifts
        - protocols.sweep.SweepProtocol
        - protocols.digital_analog.DigitalAnalogProtocol
        - protocols.gate_cz.CZProtocol
        - protocols.gate_cz.TOProtocol
        - protocols.gate_cz.ARProtocol
        - protocols.gate_cz.phase_from_chirp
        - protocols.direct_297.Direct297PiProtocol
        - protocols.direct_297.Direct297CZProtocol
        - protocols.direct_297.Direct297TOProtocol
    - title: Hamiltonian IR and results
      desc: The unified intermediate representation every backend consumes.
      contents:
        - ir.HamiltonianTerm
        - ir.HamiltonianIR
        - ir.compile_hamiltonian_ir
        - ir.EvolutionResult
    - title: Observables
      desc: >
        Immutable scalar observable expressions, built from the read-only
        factory exposed as `system.observables` and requested as a
        `dict[str, ObservableExpr]` at simulate time.
      contents:
        - core.observables.ObservableExpr
        - core.observables.ObservableFactory
    - title: "Backends: exact state-vector"
      contents:
        - backends.exact.simulate.simulate
        - backends.exact.compiler.SolverBackend
        - backends.exact.compiler.ExactCompiler
        - backends.exact.ode.ExactODEBackend
    - title: "Backends: tensor networks"
      contents:
        - backends.tn_common.TNLatticeSpec
        - backends.tn_common.create_tn_lattice_spec
        - backends.tn_common.TNEvolutionIR
        - backends.tn_common.tn_lattice_spec_from_system
        - backends.tn_common.tn_lattice_spec_from_hamiltonian_ir
        - backends.tenpy_mps.backends.TenpyOptions
    - title: Noise
      contents:
        - noise.NoiseModel
        - noise.EnsembleResult
        - noise.simulate_ensemble
    - title: State constructors
      contents:
        - core.states.product_state
        - core.states.af_config
        - core.states.domain_config
        - core.states.product_state_3level
        - core.states.ground_state
        - core.states.checkerboard_rydberg
        - core.states.product_superposition_state
        - core.states.plus_local_amplitudes
    - title: Physics helpers
      contents:
        - physics.compute_shift_scatter
        - physics.blackman_window
        - physics.blackman_pulse
        - physics.blackman_pulse_sqrt
    - title: Core model primitives
      contents:
        - core.model.BasisSpec
        - core.operators.BasisOperatorFactory
        - core.operators.StaticHamiltonianTerm
